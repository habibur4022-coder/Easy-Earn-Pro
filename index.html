<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inzar - Easy Earn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .balance-card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn { padding: 15px 30px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; width: 100%; margin: 10px 0; transition: 0.3s; }
        .btn-earn { background: #28a745; color: white; }
        .btn-withdraw { background: #ffc107; color: black; display: none; }
        .btn-support { background: #007bff; color: white; }
    </style>
</head>
<body>

    <div class="balance-card">
        <h2>আমার পয়েন্ট</h2>
        <h1 id="userPoints">0</h1>
        <p id="userName">লোড হচ্ছে...</p>
    </div>

    <button class="btn btn-earn" onclick="showAd()">অ্যাড দেখুন (পয়েন্ট পাবেন)</button>
    <button id="withdrawBtn" class="btn btn-withdraw" onclick="requestWithdraw()">পেমেন্ট রিকুয়েস্ট (১০০০+ পয়েন্ট)</button>
    <button class="btn btn-support" onclick="contactSupport()">সাপোর্ট</button>

    <script>
        // আপনার দেওয়া সেই গুরুত্বপূর্ণ ফায়ারবেজ কোড
        const firebaseConfig = {
            apiKey: "AIzaSyDITnNoq3Ze_XdcJh-YNEifQ9yhlSlNsl8",
            authDomain: "easy-earn-pro-b9163.firebaseapp.com",
            projectId: "easy-earn-pro-b9163",
            storageBucket: "easy-earn-pro-b9163.firebasestorage.app",
            messagingSenderId: "288091360425",
            appId: "1:288091360425:web:05778577f1e628bca0adb8",
            databaseURL: "https://easy-earn-pro-b9163-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // টেলিগ্রাম ইউজার ডাটা
        const tg = window.Telegram.WebApp;
        tg.ready();
        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "test_user";
        document.getElementById('userName').innerText = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "User";

        // ডাইনামিক ভেরিয়েবল (এডমিন থেকে আসবে)
        let perClickPoints = 10; 
        let supportLink = "https://t.me/yourusername";
        let adLink = "";

        // ১. এডমিন সেটিংস লোড করা
        database.ref('adminSettings').on('value', (snapshot) => {
            const settings = snapshot.val();
            if(settings) {
                perClickPoints = settings.pointsPerAd || 10;
                supportLink = settings.supportUrl || supportLink;
                adLink = settings.adsterraLink || "";
            }
        });

        // ২. ইউজারের পয়েন্ট লোড করা
        const userRef = database.ref('users/' + userId);
        userRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const points = data ? data.points : 0;
            document.getElementById('userPoints').innerText = points;
            
            // ১০০০ পয়েন্ট হলে উইথড্র বাটন দেখাবে
            if(points >= 1000) {
                document.getElementById('withdrawBtn').style.display = 'block';
            }
        });

        // ৩. অ্যাড দেখানো এবং পয়েন্ট যোগ
        function showAd() {
            if(adLink === "") {
                alert("অ্যাড এখন পাওয়া যাচ্ছে না। পরে চেষ্টা করুন।");
                return;
            }
            window.open(adLink, '_blank');
            // পয়েন্ট আপডেট
            userRef.transaction((currentData) => {
                const p = (currentData && currentData.points) ? currentData.points : 0;
                return { points: p + perClickPoints };
            });
        }

        function contactSupport() {
            window.open(supportLink, '_blank');
        }

        function requestWithdraw() {
            const number = prompt("বিকাশ বা নগদ নাম্বার দিন:");
            if(number) {
                database.ref('withdrawRequests/' + userId).set({
                    userId: userId,
                    name: tg.initDataUnsafe.user.first_name,
                    number: number,
                    status: 'Pending',
                    time: new Date().toLocaleString()
                });
                alert("রিকুয়েস্ট পাঠানো হয়েছে! এডমিন শীঘ্রই পেমেন্ট করবে।");
            }
        }
    </script>
</body>
</html>
